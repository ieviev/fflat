name: build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libbrotli-dev

      - name: configure bflat nuget source
        run: dotnet nuget add source "https://nuget.pkg.github.com/bflattened/index.json" --name bflat --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text

      - name: patch bflat
        run: bash build.sh

      - name: build bflat layouts
        run: dotnet build bflat/src/bflat/bflat.csproj -t:BuildLayouts -p:CompilerHost=linux-glibc-x64

      - name: build fflat
        run: dotnet build src/fflat/fflat.fsproj -p:CompilerHost=linux-glibc-x64

      - name: smoke test
        run: |
          dotnet src/fflat/bin/Debug/net10.0/fflat.dll samples/helloworld.fsx -o samples/helloworld-test.exe
          output=$(./samples/helloworld-test.exe | tr -d '\r')
          test "$output" = "hello world! 1123"

      - name: zerolib smoke test
        run: |
          dotnet src/fflat/bin/Debug/net10.0/fflat.dll samples/zerolib_16kb.fsx --stdlib zero -o samples/zerolib-test
          output=$(./samples/zerolib-test)
          test "$output" = "hello world"

      - name: pack
        run: dotnet pack src/fflat/fflat.fsproj -c Release -p:CompilerHost=linux-glibc-x64

      - uses: actions/upload-artifact@v4
        with:
          name: fflat-nupkg-linux
          path: src/fflat/nupkg/*.nupkg
